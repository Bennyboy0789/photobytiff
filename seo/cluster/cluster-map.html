<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --ink:#e8eaed; --muted:#9aa0aa; --line:#2b2f3a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:20px 28px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:20px; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  .wrap { display:flex; gap:0; height:calc(100vh - 74px); }
  .canvas { flex:1; overflow:hidden; position:relative; }
  aside { width:340px; border-left:1px solid var(--line); padding:20px; overflow-y:auto; background:var(--panel); }
  aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; }
  .metrics { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px; }
  .metric { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .metric .n { font-size:22px; font-weight:700; }
  .metric .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .legend div { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; }
  .dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
  .detail { margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
  .detail.hidden { display:none; }
  .detail h3 { margin:0 0 6px; font-size:15px; }
  .detail .kw { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .detail table { width:100%; border-collapse:collapse; font-size:12px; }
  .detail td { padding:4px 0; color:var(--muted); }
  .detail td:last-child { color:var(--ink); text-align:right; }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.live { background:#0f2f1c; color:#4ade80; }
  .badge.todo { background:#33240f; color:#fbbf24; }
  .badge.partial { background:#0f2333; color:#60a5fa; }
  svg text { font-family:inherit; }
  .node { cursor:pointer; }
  .node:hover .ncard { stroke:#fff; }
  .hint { position:absolute; bottom:14px; left:14px; color:var(--muted); font-size:12px; background:rgba(0,0,0,.4); padding:6px 10px; border-radius:6px; }
</style>

<body>

<div class="wrap">
  <div class="canvas"><svg id="map" width="100%" height="100%"></svg>
    <div class="hint">Solid line = live internal link · Dashed = recommended link to add</div>

  <aside>
    <h2>Overview</h2>
    <div class="metrics" id="metrics"></div>
    <h2>Clusters</h2>

const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
function el(t, a){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }

function layout(){
  const W = svg.clientWidth || 900, H = svg.clientHeight || 700;
  const cx = W/2, cy = H/2;
  const nodes = {}; // url -> {x,y,...}
  // pillar center
  nodes[CLUSTER_DATA.pillar.url] = { x:cx, y:cy, ...CLUSTER_DATA.pillar, isPillar:true, color:'#e8eaed' };

  const clusters = CLUSTER_DATA.clusters;
  const ringR = Math.min(W,H)*0.36;
  clusters.forEach((cl, ci) => {
    const baseAngle = (ci / clusters.length) * Math.PI*2 - Math.PI/2;
    const spread = Math.PI/ (clusters.length+0.5);
    cl.posts.forEach((p, pi) => {
      const t = cl.posts.length===1 ? 0 : (pi/(cl.posts.length-1) - 0.5);
      const ang = baseAngle + t*spread;
      const r = ringR + (pi%2)*46;
      nodes[p.url] = { x:cx+Math.cos(ang)*r, y:cy+Math.sin(ang)*r, ...p, color:cl.color, cluster:cl.name };
    });
  });
  return {nodes, W, H};
}

function render(){
  svg.innerHTML='';
  const {nodes} = layout();

  // links
  (CLUSTER_DATA.links||[]).forEach(lk => {
    const a = nodes[lk.from], b = nodes[lk.to];
    if(!a||!b) return;
    const live = lk.status==='live';
    svg.appendChild(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,
      stroke: live? '#3a4152':'#3a4152', 'stroke-width': live?1.6:1,
      'stroke-dasharray': live? '0':'4 4', opacity: live?0.9:0.55}));
  });

  // nodes
  Object.values(nodes).forEach(n => {
    const g = el('g',{class:'node'});
    const w = n.isPillar?150:132, h = n.isPillar?54:44;
    g.appendChild(el('rect',{class:'ncard',x:n.x-w/2,y:n.y-h/2,width:w,height:h,rx:9,
      fill: n.isPillar? '#242a36':'#1a1d24', stroke:n.color, 'stroke-width':n.isPillar?2.2:1.6}));
    // color tab
    g.appendChild(el('rect',{x:n.x-w/2,y:n.y-h/2,width:6,height:h,rx:3,fill:n.color}));
    const title = el('text',{x:n.x-w/2+14,y:n.y-2,fill:'#e8eaed','font-size':n.isPillar?12:11,'font-weight':n.isPillar?700:600});
    title.textContent = (n.title||'').length>22 ? n.title.slice(0,21)+'…' : n.title;
    g.appendChild(title);
    const sub = el('text',{x:n.x-w/2+14,y:n.y+13,fill:'#9aa0aa','font-size':9});
    sub.textContent = (n.url||'').length>26 ? n.url.slice(0,25)+'…' : n.url;
    g.appendChild(sub);
    // status dot
    const sc = n.status==='live'?'#4ade80':(n.status==='partial'?'#60a5fa':'#fbbf24');
    g.appendChild(el('circle',{cx:n.x+w/2-12,cy:n.y-h/2+12,r:4,fill:sc}));
    g.addEventListener('click',()=>showDetail(n));
    svg.appendChild(g);
  });
}

function showDetail(n){
  const d = document.getElementById('detail');
  d.classList.remove('hidden');
  const inbound = (CLUSTER_DATA.links||[]).filter(l=>l.to===n.url).length;
  const outbound = (CLUSTER_DATA.links||[]).filter(l=>l.from===n.url).length;
  d.innerHTML = `<h3>${n.title}</h3><div class="kw">${n.keyword||''}</div>
    <table>
      <tr><td>URL</td><td>${n.url}</td></tr>
      <tr><td>Cluster</td><td>${n.cluster||'Pillar'}</td></tr>
      <tr><td>Intent / template</td><td>${n.template||'—'}</td></tr>
      <tr><td>Rel. volume</td><td>${n.volume||'—'}</td></tr>
      <tr><td>Status</td><td><span class="badge ${n.status}">${n.status}</span></td></tr>
      <tr><td>Inbound links</td><td>${inbound}</td></tr>
      <tr><td>Outbound links</td><td>${outbound}</td></tr>
    </table>`;
}

function meta(){
  const m = CLUSTER_DATA.meta||{};
  const cards = [
    ['Pages', m.totalPosts], ['Clusters', m.totalClusters],
    ['Internal links', m.totalLinks],
    ['Live links', (CLUSTER_DATA.links||[]).filter(l=>l.status==='live').length]
  ];
  document.getElementById('metrics').innerHTML = cards.map(c=>`<div class="metric"><div class="n">${c[1]??'—'}</div><div class="l">${c[0]}</div></div>`).join('');
  document.getElementById('legend').innerHTML =
    `<div><span class="dot" style="background:#e8eaed"></span> Pillar — /services</div>` +
    (CLUSTER_DATA.clusters||[]).map(c=>`<div><span class="dot" style="background:${c.color}"></span> ${c.name} (${c.posts.length})</div>`).join('');
}

meta(); render();
window.addEventListener('resize', render);
</script>
